<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amy Jane Wang</title>
  <style>
    :root {
      --background: #ffffff;
      --ink: #1a1817;
      --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: var(--font-main);
    }

    .page {
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: clamp(28px, 4.5vw, 64px) clamp(24px, 7.8vw, 112px) clamp(48px, 8vw, 120px);
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2.2vw, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      column-gap: 36px;
      row-gap: 4px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: inherit;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    main {
      flex-grow: 1;
      display: flex;
      align-items: flex-end;
      padding-top: clamp(32px, 5vw, 72px);
    }

    .picture {
      position: relative;
      width: 100%;
      max-width: 662px;
    }

    .photo {
      display: block;
      width: 100%;
      height: auto;
    }

    .hole {
      position: absolute;
      inset: 0;
      background: var(--background);
      -webkit-mask-image: url(photos/landing-hole.png);
      mask-image: url(photos/landing-hole.png);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }

    .figure {
      position: absolute;
      left: 42.094%;
      bottom: 0;
      width: 35.429%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Amy Jane Wang</h1>
      <nav>
        <a href="timeline.html">timeline</a>
        <a href="works.html">publications</a>
        <a href="about.html">about</a>
        <a href="https://amyjwang.substack.com/" target="_blank">substack</a>
      </nav>
    </header>
    <main>
      <div class="picture">
        <img class="photo" src="photos/landing-photo.jpg" alt="Night photo under a stone archway with Amy's shape cut out of it">
        <div class="hole"></div>
        <img class="figure" src="photos/landing-figure.png" alt="Amy Jane Wang">
      </div>
    </main>
  </div>
</body>
</html>
