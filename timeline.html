<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline — Amy Jane Wang</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/site.css">
  <style>
    /* Fill the screen so the horizontal timeline can sit in the vertical middle. */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .hint {
      margin: 8px var(--side-margin) 0;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink-light);
    }

    /* Resume download, just under the timeline. To update it, replace
       Wang_Amy_Resume.pdf in the main folder and change the date in the link text. */
    .resume-link {
      align-self: flex-start;
      margin: 20px var(--side-margin) 48px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .resume-link:hover {
      color: var(--ink-mid);
    }


    /* ── Shared by both layouts ── */

    .item-hidden {
      display: none;
    }

    .entry-more {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink-light);
      margin-top: 4px;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .entry-more:hover {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }


    /* ── Wide screens: horizontal timeline (built in #track by js/timeline.js) ── */

    .scroller {
      overflow-x: auto;
      padding-top: clamp(24px, 4vw, 56px);
    }

    .track {
      position: relative;
    }

    .track svg {
      position: absolute;
      left: 0;
      top: 0;
    }

    /* Year labels sit on the line; the white background breaks the line behind them. */
    .year {
      position: absolute;
      font-size: 0.95rem;
      font-style: italic;
      color: var(--ink-light);
      background: var(--background);
      padding: 0 8px;
      transform: translate(-8px, -50%);
    }

    .entry {
      position: absolute;
      width: 180px; /* keep in step with HORIZONTAL.entryWidth in js/timeline.js */
    }

    .entry .entry-title {
      font-size: 0.85rem;
      line-height: 1.3;
    }

    .entry.literary .entry-title {
      color: var(--blue);
    }

    .entry .entry-desc {
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--ink-mid);
      margin-top: 3px;
    }

    .entry .entry-items {
      margin: 4px 0 0;
      padding-left: 16px;
      font-size: 0.72rem;
      line-height: 1.6;
      color: var(--ink-mid);
    }

    .entry .photo-wrap img {
      display: block;
      width: 160px;
      height: 115px;
      object-fit: cover;
      margin-top: 8px;
    }

    .entry .entry-annotation {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--ink-mid);
      margin-top: 4px;
      transform: rotate(-1deg);
    }


    /* ── Phones: vertical spine (built in #tl-canvas by js/timeline.js) ── */

    #tl-canvas {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 0 0;  /* the resume link sits right under it */
    }

    .tl-entry {
      position: absolute;
      width: 270px;
    }

    .tl-entry.literary {
      right: calc(50% + 80px);
      text-align: right;
    }

    .tl-entry.professional {
      left: calc(50% + 80px);
      text-align: left;
    }

    .tl-entry .entry-title {
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .tl-entry.literary .entry-title {
      color: var(--blue);
    }

    .tl-entry .entry-desc {
      font-size: 0.82rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-mid);
      margin-top: 2px;
    }

    .tl-entry .entry-items {
      margin-top: 5px;
      list-style: none;
      padding: 0;
    }

    .tl-entry .entry-items li {
      font-size: 0.72rem;
      font-weight: 300;
      line-height: 1.65;
      color: var(--ink-mid);
    }

    /* Photos and notes are tilted slightly, away from the spine. */
    .tl-entry .photo-wrap {
      display: inline-block;
      margin-top: 10px;
    }

    .tl-entry.literary .photo-wrap { transform: rotate(-2deg); }
    .tl-entry.professional .photo-wrap { transform: rotate(1.5deg); }

    .tl-entry .photo-wrap img {
      display: block;
      width: 175px;
      height: 125px;
      object-fit: cover;
    }

    .photo-placeholder {
      position: relative;
      display: block;
      width: 175px;
      height: 125px;
      border: 1px solid var(--ink-light);
    }

    .photo-placeholder svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .tl-entry .entry-annotation {
      display: inline-block;
      font-size: 0.82rem;
      color: var(--ink-mid);
      margin-top: 5px;
    }

    .tl-entry.literary .entry-annotation { transform: rotate(-1.2deg); }
    .tl-entry.professional .entry-annotation { transform: rotate(0.9deg); }

    /* Entries fade up into place the first time they scroll into view. */
    @keyframes tlFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tl-reveal {
      animation: tlFadeIn 0.5s ease forwards;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="about.html" class="site-title">Amy Jane Wang</a>
    <nav>
      <a href="timeline.html" class="active">timeline</a>
      <a href="works.html">publications</a>
      <a href="projects.html">projects</a>
      <a href="reading.html">reading</a>
    </nav>
  </header>

  <main>
    <!-- js/timeline.js fills one of these, depending on screen width. -->
    <div id="tl-canvas"></div>
    <div class="scroller" id="scroller">
      <div class="track" id="track"></div>
    </div>
    <p class="hint">scroll sideways →</p>
    <a class="resume-link" href="Wang_Amy_Resume.pdf" download>updated resume as of August 2026 ↓</a>
  </main>

  <script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
  <script src="js/hand-drawn.js"></script>
  <script src="js/timeline-data.js"></script>
  <script src="js/timeline.js"></script>
</body>
</html>
