<!DOCTYPE html>
<html lang="en">
<head>

  <title>About — Amy Jane Wang</title>
  <link rel="stylesheet" href="css/site.css">
  <style>
    /* Fill the screen so the photo and bio can sit along the bottom. */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* The bio sits beside the photo, lined up with its bottom edge.
       On narrow screens it wraps underneath. */
    main {
      flex-grow: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      align-content: flex-end;
      gap: 32px 56px;
      padding: clamp(32px, 5vw, 72px) var(--side-margin) clamp(48px, 8vw, 120px);
    }

    .bio {
      max-width: 300px;
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="about.html" class="site-title">Amy Jane Wang</a>
    <nav>
      <a href="timeline.html">timeline</a>
      <a href="works.html">publications</a>
      <a href="https://www.linkedin.com/in/amjwang/" target="_blank" rel="noopener">linkedin</a>
      <a href="https://amyjwang.substack.com/" target="_blank" rel="noopener">substack</a>
    </nav>
  </header>

  <main>
    <div class="cutout">
      <img class="cutout-photo" src="photos/landing-photo.jpg" alt="Night photo under a stone archway with Amy's shape cut out of it">
      <div class="cutout-hole"></div>
      <img class="cutout-figure" src="photos/landing-figure.png" alt="Amy Jane Wang">
    </div>
    <p class="bio">Hi, I'm Amy. I'm currently a junior at Stanford University — majoring in Symbolic Systems and minoring in Creative Writing.</p>
  </main>
</body>
</html>
